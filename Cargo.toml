[package]
name = "rekorderlig"
version = "1.0.0"
edition = "2021"
description = "Thumb up/down Hacker News titles and let it learn what you like"
publish = false

[dependencies]
postgres = "0.19"
tiny_http = "0.12"
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
unicode-normalization = "0.1"

[dev-dependencies]
regex = "1"

[profile.release]
lto = true
strip = true

# The model tests fit hundreds of tiny regressions; opt-level 1 keeps a plain
# `cargo test` run from crawling without giving up debug assertions.
[profile.dev]
opt-level = 1
