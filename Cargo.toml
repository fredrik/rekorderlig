[package]
name = "rekorderlig"
version = "1.0.0"
edition = "2021"
description = "Thumb up/down Hacker News titles and let it learn what you like"
publish = false

[dependencies]
postgres = "0.19"
tiny_http = "0.12"
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
unicode-normalization = "0.1"

# The one-shot importer that carries a SQLite database over to Postgres.
# Behind a feature so the shipped binary never links SQLite at all; delete
# both once the cutover has settled (Phase 7 of docs/postgres-migration.md).
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[features]
sqlite-import = ["dep:rusqlite"]

[dev-dependencies]
regex = "1"

[profile.release]
lto = true
strip = true

# The model tests fit hundreds of tiny regressions; opt-level 1 keeps a plain
# `cargo test` run from crawling without giving up debug assertions.
[profile.dev]
opt-level = 1
