# rekorderlig on Fly.io — one tiny app machine, no volume, suspends to RAM when
# idle. Deploy with: fly deploy --remote-only
#
# The data lives in Postgres on a second app, `rekorderlig-db` (fly.db.toml),
# reached over 6PN at rekorderlig-db.internal:5432. This machine holds nothing:
# it can be destroyed and redeployed without losing a vote. DATABASE_URL is a
# secret (`fly secrets set`), because it carries the password.
#
# Suspending is why src/db.rs wraps the connection: every socket held across a
# suspend is dead on resume, and the first statement after a visit has to
# reopen rather than 500.
#
# There is a second machine in this app that is not described here and cannot
# be: `rekorderlig-sync`, a scheduled machine that runs `rekorderlig
# sync-remote` hourly to keep the corpus fresh. fly.toml has no way to say
# "hourly", so it is created and repaired by scripts/fly-sync-machine.sh, which
# the deploy workflow runs after every deploy. It has no volume and no
# services — it wakes the machine below over HTTP like any other client.
app = "rekorderlig"
primary_region = "arn"

[build]

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
