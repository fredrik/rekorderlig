# rekorderlig on Fly.io — single tiny machine, SQLite on a volume,
# suspends to RAM when idle. Deploy with: fly deploy --remote-only
app = "rekorderlig"
primary_region = "arn"

[build]

[mounts]
  source = "rekorderlig_data"
  destination = "/data"

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
