# rekorderlig on Fly.io — one tiny app machine, no volume, kept running.
# Deploy with: fly deploy --remote-only
#
# The data lives in Postgres on a second app, `rekorderlig-db` (fly.db.toml),
# reached over 6PN at rekorderlig-db.internal:5432. This machine holds nothing:
# it can be destroyed and redeployed without losing a vote. DATABASE_URL is a
# secret (`fly secrets set`), because it carries the password.
#
# The machine used to suspend to RAM when idle. It no longer does, but a
# suspend or stop is still one `fly` command (or a host migration) away, and
# that is why src/db.rs wraps the connection: every socket held across one is
# dead on resume, and the first statement after has to reopen rather than 500.
#
# There is a second machine in this app that is not described here and cannot
# be: `rekorderlig-sync`, a scheduled machine that runs `rekorderlig
# sync-remote` hourly to keep the corpus fresh. fly.toml has no way to say
# "hourly", so it is created and repaired by scripts/fly-sync-machine.sh, which
# the deploy workflow runs after every deploy. It has no volume and no
# services — it wakes the machine below over HTTP like any other client.
app = "rekorderlig"
primary_region = "arn"

[build]

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One, not zero, since 2026-10-29. Zero meant every wake was a fresh CPU
  # reservation on a shared host, and on a full host the proxy retries that
  # reservation forever (docs/design/deploy.md, the one-machine section).
  # Suspend was idling the machine 81% of the time, but the hourly sync and
  # the uptime probe woke it 56 times in 48 hours — 56 chances to lose that
  # roll — to save about $2.60 a month on a shared-cpu-1x. Holding the
  # reservation buys both failure modes away for the price of a coffee.
  min_machines_running = 1

# Is the process answering, and can it reach the database? Without this a
# machine whose four worker threads had all died still accepted connections
# and answered nothing (issue #105), and a deploy of a binary that panics at
# boot still went green. The check runs from the host against the machine's
# private address, not through the proxy, so it neither counts as traffic
# that keeps the machine awake nor wakes a suspended one.
[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
