[project]
name = "hn-clusters"
version = "0.1.0"
description = "Fetch, embed and cluster Hacker News story titles."
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hdbscan>=0.8.44",
    "matplotlib>=3.11.1",
    "polars>=1.44.1",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.0",
    "umap-learn>=0.5.12",
]

[project.scripts]
hn-clusters = "hn_clusters.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "ANN",  # missing annotations
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Test bodies return None and say so once, at the signature.
"tests/*" = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
