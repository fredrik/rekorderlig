# Ephemeral Fly.io review apps: every PR gets its own copy of the app at
# https://rekorderlig-pr-<number>.fly.dev, redeployed on each push and
# destroyed when the PR closes. Requires the FLY_ORG_API_TOKEN secret: an
# org-scoped token (`fly tokens create org`) so the workflow may create and
# destroy apps — production deploys keep using the app-scoped FLY_API_TOKEN.
#
# On first deploy the data volume is restored from an on-demand snapshot of
# the production volume, so a preview opens holding the real corpus, votes and
# models; each push then tops it up with a short sync. The volume step holds
# the fallback chain (newest automatic daily snapshot, then an empty volume).
#
# Each deploy sets a fresh random AUTH_TOKEN on the preview and posts the
# clickable ?token= link in the PR comment. The token stops URL-pattern
# scanners, not people who can read the PR — the repo is public, so treat
# previews as visible to anyone reading the PR. It dies with the app. Since
# the seed is a production snapshot, that visibility now covers the real
# vote history too.
name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

# One deploy/destroy at a time per PR; a newer push supersedes an older deploy.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FLY_API_TOKEN: ${{ secrets.FLY_ORG_API_TOKEN }}
  APP_NAME: rekorderlig-pr-${{ github.event.pull_request.number }}
  REGION: arn

jobs:
  deploy:
    name: Deploy preview
    # Fork PRs don't get secrets, so only same-repo branches deploy.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: pr-${{ github.event.pull_request.number }}
      url: https://rekorderlig-pr-${{ github.event.pull_request.number }}.fly.dev/?token=${{ steps.auth.outputs.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check the org token is configured
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error title=FLY_ORG_API_TOKEN is not set::PR previews need the FLY_ORG_API_TOKEN repo secret: an org-scoped Fly token (fly tokens create org) that can create and destroy apps."
            exit 1
          fi

      - name: Create the app on first deploy
        run: |
          if ! flyctl status --app "$APP_NAME" >/dev/null 2>&1; then
            if ! flyctl apps create "$APP_NAME"; then
              echo "::error title=Could not create $APP_NAME::An 'unauthorized' error here usually means FLY_ORG_API_TOKEN is not org-scoped. Create one with: fly tokens create org"
              exit 1
            fi
          fi

      # A preview is born holding production's corpus: on first deploy the
      # volume is created from a snapshot of the production volume, taken on
      # demand here so it is minutes old rather than up to a day (Fly also
      # takes an automatic daily one — the newest of those is the fallback if
      # ours never lands, and an empty volume plus the sync step below is the
      # fallback to that). A snapshot is a crash-consistent block copy of a
      # live WAL database: SQLite replays the WAL on first open, the same as
      # after a power cut. Snapshots are block-level, so production is never
      # woken for any of this.
      - name: Create the data volume from a prod snapshot on first deploy
        env:
          PROD_APP: rekorderlig
        run: |
          if flyctl volumes list --app "$APP_NAME" --json \
              | jq -e 'map(select(.name == "rekorderlig_data")) | length > 0' >/dev/null; then
            echo "volume exists; keeping its data"
            exit 0
          fi

          SNAPSHOT=""
          PROD_VOL=$(flyctl volumes list --app "$PROD_APP" --json | jq -r '.[0].id // empty')
          if [ -n "$PROD_VOL" ]; then
            # ISO 8601 UTC compares lexicographically, so "newer than the
            # moment we asked" is a string comparison against created_at.
            ASKED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            flyctl volumes snapshots create "$PROD_VOL" || true
            for _ in $(seq 1 24); do
              sleep 5
              SNAPSHOT=$(flyctl volumes snapshots list "$PROD_VOL" --json \
                | jq -r --arg t "$ASKED_AT" \
                    '[.[] | select(.status == "created" and .created_at >= $t)]
                     | sort_by(.created_at) | last | .id // empty')
              [ -n "$SNAPSHOT" ] && break
            done
            if [ -z "$SNAPSHOT" ]; then
              echo "::warning title=On-demand snapshot never appeared::Seeding from the newest automatic daily snapshot instead."
              SNAPSHOT=$(flyctl volumes snapshots list "$PROD_VOL" --json \
                | jq -r '[.[] | select(.status == "created")]
                         | sort_by(.created_at) | last | .id // empty')
            fi
          fi

          if [ -z "$SNAPSHOT" ]; then
            echo "::warning title=No prod snapshot available::Creating an empty volume; the sync step is the only seed."
            flyctl volumes create rekorderlig_data \
              --app "$APP_NAME" --region "$REGION" --size 1 --yes
          elif ! flyctl volumes create rekorderlig_data \
              --app "$APP_NAME" --region "$REGION" --size 1 \
              --snapshot-id "$SNAPSHOT" --yes; then
            echo "::warning title=Restore from $SNAPSHOT failed::Creating an empty volume; the sync step is the only seed."
            flyctl volumes create rekorderlig_data \
              --app "$APP_NAME" --region "$REGION" --size 1 --yes
          else
            echo "seeded from $SNAPSHOT"
          fi

      - name: Stage a fresh auth token for this deploy
        id: auth
        run: |
          TOKEN=$(openssl rand -hex 16)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          flyctl secrets set --app "$APP_NAME" --stage AUTH_TOKEN="$TOKEN"

      - name: Deploy
        run: flyctl deploy --remote-only --app "$APP_NAME" --ha=false

      # The snapshot is minutes to hours old and a preview has no hourly sync
      # machine, so kick one sync to top up today's stories — and when the
      # snapshot path fell through, this is the whole seed. It answers 202 and
      # fetches in the background.
      - name: Top up the preview with recent stories
        env:
          PREVIEW_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          curl -fsS -m 30 -X POST "https://$APP_NAME.fly.dev/api/sync" \
            -H "authorization: Bearer $PREVIEW_TOKEN" \
            -H 'content-type: application/json' \
            -d '{"days": 3}' || echo "::warning title=Preview seed failed::hit 'Fetch new stories' in the app"

      - name: Comment the preview URL on the PR
        uses: actions/github-script@v8
        env:
          PREVIEW_TOKEN: ${{ steps.auth.outputs.token }}
        with:
          script: |
            const marker = '<!-- rekorderlig-pr-preview -->';
            const url = `https://${process.env.APP_NAME}.fly.dev/?token=${process.env.PREVIEW_TOKEN}`;
            const body = [
              marker,
              '### 🚀 PR preview',
              '',
              `**${url}**`,
              '',
              `Redeployed on every push (last: \`${context.payload.pull_request.head.sha.slice(0, 7)}\`,`,
              `${new Date().toISOString().replace('T', ' ').slice(0, 16)} UTC) and destroyed when this PR closes.`,
              'The machine scales to zero, so the first load may take a few seconds while',
              'it wakes up. Seeded from a production snapshot on first deploy; each push',
              'tops up recent stories.',
              '',
              'Each push mints a fresh token, so always enter through the link above.',
              'The token guards this throwaway app against URL scanners — anyone who can',
              'read this PR can open the preview.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  destroy:
    name: Destroy preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check the org token is configured
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error title=FLY_ORG_API_TOKEN is not set::Cannot tear down the preview app without the FLY_ORG_API_TOKEN repo secret — destroy rekorderlig-pr-${{ github.event.pull_request.number }} manually if it exists."
            exit 1
          fi

      - name: Destroy the app and its volume
        run: |
          if flyctl status --app "$APP_NAME" >/dev/null 2>&1; then
            flyctl apps destroy "$APP_NAME" --yes
          fi

      - name: Update the PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- rekorderlig-pr-preview -->';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body: `${marker}\n### 🧹 PR preview destroyed\n\nThe preview app and its volume were removed when this PR closed.`,
              });
            }
