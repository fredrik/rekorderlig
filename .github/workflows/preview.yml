# Ephemeral Fly.io review apps: every PR gets its own copy of the app at
# https://rekorderlig-pr-<number>.fly.dev, redeployed on each push and
# destroyed when the PR closes. Requires the FLY_ORG_API_TOKEN secret: an
# org-scoped token (`fly tokens create org`) so the workflow may create and
# destroy apps — production deploys keep using the app-scoped FLY_API_TOKEN.
#
# Each preview gets its own database on the shared `rekorderlig-db` machine —
# `preview_pr_<number>`, restored from a fresh `pg_dump` of production — so it
# opens holding the real corpus, votes and models; each push then tops it up
# with a short sync. The seeding step holds the fallback (an empty database
# plus that sync). Two credentials do this and neither is production's:
# `preview_reader` may only read `rekorderlig`, `preview_admin` may only
# CREATEDB. See scripts/fly-db-setup.sh.
#
# Each deploy sets a fresh random AUTH_TOKEN on the preview and posts the
# clickable ?token= link in the PR comment. The token stops URL-pattern
# scanners, not people who can read the PR — the repo is public, so treat
# previews as visible to anyone reading the PR. It dies with the app. Since
# the seed is a production snapshot, that visibility now covers the real
# vote history too.
name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

# One deploy/destroy at a time per PR; a newer push supersedes an older deploy.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FLY_API_TOKEN: ${{ secrets.FLY_ORG_API_TOKEN }}
  APP_NAME: rekorderlig-pr-${{ github.event.pull_request.number }}
  # Database names cannot carry a dash unquoted, and `preview_` is the prefix
  # the preview_admin role is scoped to.
  DB_NAME: preview_pr_${{ github.event.pull_request.number }}
  DB_APP: rekorderlig-db
  REGION: arn

jobs:
  deploy:
    name: Deploy preview
    # Fork PRs don't get secrets, so only same-repo branches deploy.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: pr-${{ github.event.pull_request.number }}
      url: https://rekorderlig-pr-${{ github.event.pull_request.number }}.fly.dev/?token=${{ steps.auth.outputs.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check the org token is configured
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error title=FLY_ORG_API_TOKEN is not set::PR previews need the FLY_ORG_API_TOKEN repo secret: an org-scoped Fly token (fly tokens create org) that can create and destroy apps."
            exit 1
          fi

      - name: Create the app on first deploy
        run: |
          if ! flyctl status --app "$APP_NAME" >/dev/null 2>&1; then
            if ! flyctl apps create "$APP_NAME"; then
              echo "::error title=Could not create $APP_NAME::An 'unauthorized' error here usually means FLY_ORG_API_TOKEN is not org-scoped. Create one with: fly tokens create org"
              exit 1
            fi
          fi

      # A preview is born holding production's corpus. `pg_dump -Fc` of the
      # live database, restored into a database of this PR's own on the same
      # machine — minutes old rather than up to a day, and taken by a role that
      # can do nothing but read it. `fly proxy` is how anything outside the
      # organisation's private network reaches a machine that publishes no
      # services; both URLs below point at that local port.
      #
      # First deploy only: a redeploy keeps whatever the preview holds,
      # including votes cast while trying the change out.
      - name: Seed the preview database from production
        id: seed
        env:
          PREVIEW_PG_PASSWORD: ${{ secrets.PREVIEW_PG_PASSWORD }}
          PREVIEW_PG_READER_PASSWORD: ${{ secrets.PREVIEW_PG_READER_PASSWORD }}
        run: |
          if [ -z "$PREVIEW_PG_PASSWORD" ]; then
            echo "::error title=PREVIEW_PG_PASSWORD is not set::PR previews need the preview_admin password as a repo secret. See scripts/fly-db-setup.sh."
            exit 1
          fi
          . scripts/ci-pg-client.sh

          # The same helper the local scripts use, rather than a second, worse
          # copy of it inline: it reports why `fly proxy` failed instead of
          # leaving psql to complain about localhost a minute later.
          . scripts/fly-pg-proxy.sh
          pg_proxy_start "$DB_APP" 15432

          ADMIN="postgres://preview_admin:$PREVIEW_PG_PASSWORD@localhost:15432/postgres"
          if psql "$ADMIN" -tAc "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME'" | grep -q 1; then
            echo "$DB_NAME exists; keeping its data"
            echo "seeded=kept" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          psql "$ADMIN" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $DB_NAME"

          READER="postgres://preview_reader:$PREVIEW_PG_READER_PASSWORD@localhost:15432/rekorderlig"
          TARGET="postgres://preview_admin:$PREVIEW_PG_PASSWORD@localhost:15432/$DB_NAME"
          if pg_dump -Fc --no-owner --no-privileges -f /tmp/prod.dump "$READER" \
             && pg_restore --no-owner --no-privileges --single-transaction -d "$TARGET" /tmp/prod.dump; then
            # Without statistics the training queue seq-scans the whole corpus
            # for every card — correct, and slow enough to look like a bug.
            psql "$TARGET" -c "ANALYZE"
            echo "seeded from production"
            echo "seeded=production" >> "$GITHUB_OUTPUT"
          else
            # Not an error: a preview that deploys empty still beats no
            # preview. But it must not be quiet — the PR comment says so too,
            # because that is where anyone actually looks.
            echo "::warning title=Seed from production failed::The preview starts empty; the sync step below is the only seed."
            echo "seeded=empty" >> "$GITHUB_OUTPUT"
          fi

      - name: Point the preview at its database
        env:
          PREVIEW_PG_PASSWORD: ${{ secrets.PREVIEW_PG_PASSWORD }}
        run: |
          flyctl secrets set --app "$APP_NAME" --stage \
            "DATABASE_URL=postgres://preview_admin:$PREVIEW_PG_PASSWORD@$DB_APP.internal:5432/$DB_NAME"

      - name: Stage a fresh auth token for this deploy
        id: auth
        run: |
          TOKEN=$(openssl rand -hex 16)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          flyctl secrets set --app "$APP_NAME" --stage AUTH_TOKEN="$TOKEN"

      # The head sha rather than GITHUB_SHA, which on a pull_request event is
      # a synthetic merge commit that exists nowhere you can link to. The head
      # is what the PR comment below names, so the Brain tab and the comment
      # agree on which code the preview is running.
      - name: Deploy
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >
          flyctl deploy --remote-only --app "$APP_NAME" --ha=false
          --build-arg GIT_SHA="$HEAD_SHA"
          --build-arg BUILD_TIME="$(date -u +%s)"

      # The snapshot is minutes to hours old and a preview has no hourly sync
      # machine, so kick one sync to top up today's stories — and when the
      # snapshot path fell through, this is the whole seed. It answers 202 and
      # fetches in the background.
      - name: Top up the preview with recent stories
        env:
          PREVIEW_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          curl -fsS -m 30 -X POST "https://$APP_NAME.fly.dev/api/sync" \
            -H "authorization: Bearer $PREVIEW_TOKEN" \
            -H 'content-type: application/json' \
            -d '{"days": 3}' || echo "::warning title=Preview seed failed::hit 'Fetch new stories' in the app"

      - name: Comment the preview URL on the PR
        uses: actions/github-script@v8
        env:
          PREVIEW_TOKEN: ${{ steps.auth.outputs.token }}
          SEEDED: ${{ steps.seed.outputs.seeded }}
        with:
          script: |
            const marker = '<!-- rekorderlig-pr-preview -->';
            const url = `https://${process.env.APP_NAME}.fly.dev/?token=${process.env.PREVIEW_TOKEN}`;
            const body = [
              marker,
              '### 🚀 PR preview',
              '',
              `**${url}**`,
              '',
              `Redeployed on every push (last: \`${context.payload.pull_request.head.sha.slice(0, 7)}\`,`,
              `${new Date().toISOString().replace('T', ' ').slice(0, 16)} UTC) and destroyed when this PR closes.`,
              'The machine scales to zero, so the first load may take a few seconds while',
              'it wakes up. Seeded from a dump of production on first deploy; each push',
              'tops up recent stories.',
              ...(process.env.SEEDED === 'empty'
                ? ['', '⚠️ **The seed from production failed**, so this preview holds only the',
                   'stories the top-up sync fetched — no votes and no model. See the',
                   '"Seed the preview database" step for why.']
                : []),
              '',
              'Each push mints a fresh token, so always enter through the link above.',
              'The token guards this throwaway app against URL scanners — anyone who can',
              'read this PR can open the preview.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  destroy:
    name: Destroy preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Checked out for scripts/fly-pg-proxy.sh, which the database drop needs.
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check the org token is configured
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error title=FLY_ORG_API_TOKEN is not set::Cannot tear down the preview app without the FLY_ORG_API_TOKEN repo secret — destroy rekorderlig-pr-${{ github.event.pull_request.number }} manually if it exists."
            exit 1
          fi

      - name: Destroy the app
        run: |
          if flyctl status --app "$APP_NAME" >/dev/null 2>&1; then
            flyctl apps destroy "$APP_NAME" --yes
          fi

      # The database outlives the app it belonged to, so dropping it is its own
      # step — and the sweep is there because this job can be skipped entirely
      # (a fork PR, a failed run, a PR closed while Fly was down), and an
      # orphaned preview database is invisible until the volume fills.
      - name: Drop the preview database, and any left by earlier PRs
        env:
          PREVIEW_PG_PASSWORD: ${{ secrets.PREVIEW_PG_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$PREVIEW_PG_PASSWORD" ] || { echo "::warning title=No PREVIEW_PG_PASSWORD::Drop $DB_NAME by hand."; exit 0; }
          . scripts/ci-pg-client.sh
          . scripts/fly-pg-proxy.sh
          pg_proxy_start "$DB_APP" 15432
          ADMIN="postgres://preview_admin:$PREVIEW_PG_PASSWORD@localhost:15432/postgres"

          # FORCE: the preview app may still hold a connection in the seconds
          # before its machine goes away.
          psql "$ADMIN" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $DB_NAME WITH (FORCE)"

          for db in $(psql "$ADMIN" -tAc "SELECT datname FROM pg_database WHERE datname LIKE 'preview\_pr\_%'"); do
            n=${db##*_}
            state=$(gh pr view "$n" --json state -q .state 2>/dev/null || echo UNKNOWN)
            if [ "$state" = CLOSED ] || [ "$state" = MERGED ]; then
              echo "sweeping $db (PR #$n is $state)"
              psql "$ADMIN" -c "DROP DATABASE IF EXISTS $db WITH (FORCE)"
            fi
          done

      - name: Update the PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- rekorderlig-pr-preview -->';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body: `${marker}\n### 🧹 PR preview destroyed\n\nThe preview app and its volume were removed when this PR closed.`,
              });
            }
