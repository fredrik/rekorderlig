name: CI

# Pushes to main and PRs; a push to a PR branch is covered by the PR run,
# so branch pushes alone don't start a second identical job.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test
