name: CI

# Pull requests only. `main` is tested by the `Deploy` workflow, which calls
# the same reusable job and will not ship an image the tests rejected; a
# `push: [main]` trigger here would run them a second time, next to the deploy
# rather than in front of it, and nothing would read the answer.
#
# A push to a PR branch is covered by the PR run, so branch pushes alone don't
# start a second identical job.
on:
  pull_request:

jobs:
  test:
    uses: ./.github/workflows/tests.yml
