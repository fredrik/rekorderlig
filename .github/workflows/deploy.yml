name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The gate. `Deploy` and `CI` used to trigger on the same push and run
  # independently, so a merge shipped to Fly alongside the tests and
  # regardless of their verdict. A PR run gated the merge button but neither
  # of the two paths around it: a direct push to `main`, and a merge whose
  # base moved after the PR's last run — that merge commit was only tested
  # once it had already deployed. Testing the pushed commit here, in the
  # workflow the deploy job `needs:`, closes both. It is the same job `CI`
  # runs on a pull request, so this is not a second opinion about what the
  # tests are.
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --ha=false, or a deploy that finds no machines creates two. One is
      # the design: `Syncer` refuses a concurrent run within its own process
      # and has no way to refuse one on another machine, so a second machine
      # turns "only one sync at a time" from an invariant into a hope. The
      # model cache and the round both go through the database and are safe
      # either way; the syncer is the one that is not. Nothing here wants HA —
      # it is one user, on machines that suspend to RAM.
      #
      # The commit and build time are baked into the binary (src/version.rs)
      # so the Brain tab and `fly logs` can say which code is running.
      - run: >
          flyctl deploy --remote-only --ha=false
          --build-arg GIT_SHA="$GITHUB_SHA"
          --build-arg BUILD_TIME="$(date -u +%s)"

      # The corpus is kept fresh by an hourly Fly scheduled machine, not by a
      # workflow on a cron (see scripts/fly-sync-machine.sh). `fly deploy` does
      # not manage that machine and may have wiped or destroyed it, so put it
      # back — the script is a no-op when it is already right.
      - name: Reconcile the hourly sync machine
        run: scripts/fly-sync-machine.sh
