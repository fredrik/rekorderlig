name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # BUILD_REV bakes the deployed sha into the binary; the app shows it
      # at the foot of Brain, which is how you tell what is actually live.
      - run: flyctl deploy --remote-only --build-arg BUILD_REV="${{ github.sha }}"
