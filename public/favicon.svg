<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The icon: a thumb up on an orange tile. The tile is HN's own square in
       the app's accent, because this is Hacker News with a vote on every card;
       the corner radius is the cards' 14 px. The thumb is the judge button's
       glyph (Lucide thumbs-up), filled rather than stroked so it still reads
       at 16 px. This file is the drawing; favicon.ico, apple-touch-icon.png
       and the og.png card are rendered from it by scripts/brand/render.sh. -->
  <rect width="64" height="64" rx="14" fill="#ff6600"/>
  <g transform="translate(11.6 11.6) scale(1.7)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <path d="M7 10.5v11.5" fill="none" stroke="#ff6600" stroke-width="1.6"/>
  </g>
</svg>
